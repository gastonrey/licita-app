name: CI

# Run on every PR (covers PRs targeting any branch). No separate `push`
# trigger: pushes to a PR branch are already validated via pull_request, so
# this avoids double-running CI on every opened PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
